{% extends "booking/base.html" %}
{% block title %}Logg inn{% endblock %}
{% block content %}
<div class="card" style="text-align:center;">
  <h1>Velkommen 💕</h1>
  <p class="lead">Logg inn for å fortsette</p>
  <form method="post" style="text-align:left;">
    {% csrf_token %}
    <label for="id_username">Brukernavn</label>
    <input type="text" name="username" id="id_username" required autofocus>
    <label for="id_password">Passord</label>
    <input type="password" name="password" id="id_password" required>
    {% if form.errors %}
      <p style="color:var(--red); font-size:14px; margin-bottom:12px;">Feil brukernavn eller passord.</p>
    {% endif %}
    <button type="submit" style="width:100%;">Logg inn</button>
  </form>
</div>
{% endblock %}
